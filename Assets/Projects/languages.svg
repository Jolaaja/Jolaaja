<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
    <title id="title">Most Used Languages</title>
    <desc id="desc">A gold-framed heading for language statistics from public repositories.</desc>
    <defs>
          <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b1a"/><stop offset="1" stop-color="#24211b"/></linearGradient>
          <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c7a66a" stop-opacity=".12"/><stop offset=".5" stop-color="#c7a66a" stop-opacity=".8"/><stop offset="1" stop-color="#c7a66a" stop-opacity=".12"/></linearGradient>
    </defs>
    <rect width="1200" height="170" rx="22" fill="url(#panel)"/>
    <rect x="1" y="1" width="1198" height="168" rx="21" fill="none" stroke="#c7a66a" stroke-opacity=".55" stroke-width="2"/>
    <text x="600" y="57" text-anchor="middle" fill="#f4efe7" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">MOST USED LANGUAGES</text>
    <rect x="440" y="76" width="320" height="2" rx="1" fill="url(#rule)"/>
    <text x="600" y="119" text-anchor="middle" fill="#c9c1b4" font-family="Segoe UI,Arial,sans-serif" font-size="19">A snapshot of activity across public repositories</text>
</svg>
